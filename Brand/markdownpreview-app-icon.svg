  <rect x="66" y="66" width="892" height="892" rx="186" fill="none" stroke="#c9b59a" stroke-width="8"/>
  <rect x="112" y="112" width="800" height="800" rx="148" fill="none" stroke="#e3d7c7" stroke-width="2"/>
