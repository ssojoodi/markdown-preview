<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Markdown Preview logo</title>
  <desc id="desc">Elegant serif Md monogram with a wordmark.</desc>
  <rect width="1200" height="320" fill="none"/>
  <g fill="#1f1a17">
    <text
      x="86"
      y="208"
      font-family="Baskerville, 'Iowan Old Style', 'Times New Roman', serif"
      font-size="190"
      font-weight="600"
      letter-spacing="-10">M</text>
    <text
      x="266"
      y="208"
      font-family="Baskerville, 'Iowan Old Style', 'Times New Roman', serif"
      font-size="198"
